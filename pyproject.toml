[project]
name = "devlab"
version = "0.1.0"
description = "Development environment manager"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
]

[project.scripts]
devlab = "devlab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.16.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
]
